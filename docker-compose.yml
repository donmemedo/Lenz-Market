services:
  api:
    build: ./backend
    container_name: qaab-api
    environment:
      QAAB_DATA_DIR: /srv/data
      QAAB_MEDIA_DIR: /srv/media
      # Empty SECRET_KEY in development = random key generated once in the data volume.
      SECRET_KEY: ${SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3041}
      APP_ENV: ${APP_ENV:-development}
      QAAB_SEED_DEMO: ${QAAB_SEED_DEMO:-1}
    volumes:
      - qaab-data:/srv/data
      - qaab-media:/srv/media
    ports:
      - "8041:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8041}
        NEXT_PUBLIC_DEMO: ${NEXT_PUBLIC_DEMO:-1}
    container_name: qaab-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8041}
    ports:
      - "3041:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qaab-data:
  qaab-media:
