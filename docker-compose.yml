services:
  api:
    build: ./backend
    container_name: qaab-api
    environment:
      QAAB_DATA_DIR: /srv/data
      QAAB_MEDIA_DIR: /srv/media
      APP_ENV: ${APP_ENV:-development}
      # Passed through from .env / the shell; app/config.py holds the defaults.
      SECRET_KEY:            # unset in development = random key kept in the data volume
      CORS_ORIGINS:
      QAAB_SEED_DEMO:        # always off when APP_ENV=production
      FORWARDED_ALLOW_IPS:   # your reverse proxy, so per-IP rate limits see real clients
    volumes:
      - qaab-data:/srv/data
      - qaab-media:/srv/media
    ports:
      - "8041:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8041}
    container_name: qaab-web
    ports:
      - "3041:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qaab-data:
  qaab-media:
