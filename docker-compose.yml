services:
  api:
    build: ./backend
    container_name: qaab-api
    environment:
      QAAB_DATA_DIR: /srv/data
      QAAB_MEDIA_DIR: /srv/media
      SECRET_KEY: ${SECRET_KEY:-qaab-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - qaab-data:/srv/data
      - qaab-media:/srv/media
    ports:
      - "8041:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8041}
    container_name: qaab-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8041}
    ports:
      - "3041:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qaab-data:
  qaab-media:
